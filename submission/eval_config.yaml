# Per-task budgets for the scoring run, matching the public 0.18-0.24 bundles.
# All ~120 hidden tasks must finish in 12 hours; most tasks stop early at the
# call cap or by submitting, so the 8-minute cap is rarely reached.
evaluation:
  # Also bounds the grader's pytest run: some test modules need ~100-120 s, so
  # a lower value can fail a correct patch.
  timeout_seconds: 240
  # The harness appends "Only N tool call(s) remaining ... call submit_patch
  # soon" to every tool result once 10 or fewer calls remain (for budgets of
  # 20+). Agents ignore call limits written in the prompt; this cap is what
  # makes them edit and submit. The warning starts at call 18.
  max_tool_calls: 28
  max_time_minutes: 8
  max_turns: 80
