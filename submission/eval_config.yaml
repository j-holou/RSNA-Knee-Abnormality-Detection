# Per-task budgets for the scoring run. All ~120 hidden tasks must finish in
# 12 hours including setup and verification, so keep sessions near 5 minutes.
evaluation:
  timeout_seconds: 120
  # The harness appends "Only N tool call(s) remaining ... call submit_patch
  # soon" to every tool result once 10 or fewer calls remain (for budgets of
  # 20+). Agents ignore call limits written in the prompt, so this cap is what
  # makes them edit and submit; at 24, the warning starts at call 14.
  max_tool_calls: 24
  max_time_minutes: 5
  max_turns: 100
